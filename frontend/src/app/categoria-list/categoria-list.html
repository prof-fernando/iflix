<h1> Lista de categorias</h1>
<a href="/categoria"> Nova Categoria </a>
@if( categorias().length > 0 ){
   
    <ul>
        @for( cat of categorias();track cat.idCategoria ){
            <li>
                 {{cat.nome}} => {{cat.idCategoria}}  
                 <a href="/categoria/{{cat.idCategoria}}">
                    editar
                 </a>

            </li>
            
        }
    </ul>

} 
@else{
    <h3>
        Nenhuma categoria encontrada!
    </h3>
    <p>
        cadastre uma clicando aqui!
    </p>

}
